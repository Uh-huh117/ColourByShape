<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Zen Scratch Color</title>
  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Apple Touch Icon (Critical for iOS/Safari home screen saving) -->
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  
  <!-- Standard Favicon -->
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  
  <!-- Theme Color for browser tab bar styling -->
  <meta name="theme-color" content="#1a202c">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="logo-title">
      <button id="btn-back-gallery" class="icon-btn hidden" title="Back to Gallery">← Gallery</button>
      <h1>Zen Scratch</h1>
    </div>
    <div class="header-actions">
      <label for="image-upload-input" class="btn btn-primary" id="upload-label">+ New Picture</label>
      <input type="file" id="image-upload-input" accept="image/*" class="hidden">
      <button id="btn-toggle-sidebar" class="icon-btn hidden" title="Toggle Menu">☰</button>
    </div>
  </header>

  <!-- Main View 1: Gallery View -->
  <main id="view-gallery" class="view-active">
    <div class="gallery-container">
      <h2>Your Canvas Collection</h2>
      <div id="gallery-grid" class="gallery-grid">
        <!-- Dynamic gallery cards populated via JS -->
      </div>
      <div id="gallery-empty-state" class="empty-state">
        <p>No canvases yet. Upload an image to create your first scratch-reveal page!</p>
      </div>
    </div>
  </main>

  <!-- Main View 2: Studio / Workspace View -->
  <main id="view-studio" class="view-hidden">
    <!-- Sliding Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h3>Studio Controls</h3>
        <button id="btn-close-sidebar" class="icon-btn">&times;</button>
      </div>

      <div class="sidebar-section">
        <h4>Coloring Mode</h4>
        <div class="toggle-group">
          <button id="mode-paint" class="mode-btn active">🖌️ Paint (Manual)</button>
          <button id="mode-tap" class="mode-btn">🪄 Tap to Reveal</button>
        </div>
      </div>

      <div class="sidebar-section">
        <h4>Outlines</h4>
        <label class="switch-label">
          <span>Show Black Outlines</span>
          <input type="checkbox" id="toggle-outlines" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="sidebar-section">
        <h4>Brush Size</h4>
        <input type="range" id="brush-size" min="10" max="80" value="30">
      </div>

      <div class="sidebar-section">
        <h4>Detected Color Groups</h4>
        <div id="palette-container" class="palette-grid">
          <!-- Populated dynamically -->
        </div>
      </div>

      <div class="sidebar-section">
        <h4>Audio Settings</h4>
        <label class="audio-toggle">
          <input type="checkbox" id="toggle-ambient-audio">
          <span>🎵 Ambient Music</span>
        </label>
        <label class="audio-toggle">
          <input type="checkbox" id="toggle-sfx-audio" checked>
          <span>🔊 Painting Sound Effects</span>
        </label>
      </div>
    </aside>

    <!-- Interactive Canvas Viewport (Pinch / Zoom Container) -->
    <div id="viewport" class="viewport">
      <div id="canvas-wrapper" class="canvas-wrapper">
        <!-- Layer 1: Base Color Image -->
        <canvas id="layer-color"></canvas>
        <!-- Layer 2: Scratch-reveal White Mask -->
        <canvas id="layer-scratch"></canvas>
        <!-- Layer 3: Smooth Vector-like Outlines -->
        <canvas id="layer-outline"></canvas>
      </div>
    </div>
  </main>

  <!-- Audio Elements -->
  <audio id="audio-ambient" loop src="assets/ambient.mp3"></audio>
  <audio id="audio-paint" src="assets/paint.mp3"></audio>

  <script src="app.js"></script>
</body>
</html>
